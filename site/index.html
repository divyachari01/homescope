<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeScope</title>
<meta name="description" content="Check any US zip code before buying: 50 years of prices, rates and buying power, timing, rentals, neighborhood, politics and landlord law.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>HomeScope</h1>
    <p class="tag">Look up any US zip code before you buy.</p>
    <form id="lookup" class="lookup" autocomplete="off">
      <input id="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="Zip code" aria-label="Zip code" required>
      <select id="purpose" aria-label="What is the home for?">
        <option value="live">To live in</option>
        <option value="rent">As a rental investment</option>
        <option value="hack">Live in part, rent out part</option>
        <option value="str">Short-term rental (Airbnb)</option>
      </select>
      <button type="submit">Check</button>
    </form>
  </div>
</header>

<div class="wrap">
  <details id="you" class="panel">
    <summary>Your numbers <span class="muted">(stay on this device)</span></summary>
    <div class="grid-inputs">
      <label>Household income / yr<input data-k="income" type="number" step="1000"></label>
      <label>Other debt payments / mo<input data-k="debts" type="number" step="50"></label>
      <label>Cash saved for buying<input data-k="cash" type="number" step="1000"></label>
      <label>You save each month<input data-k="save" type="number" step="100"></label>
      <label>Your rent now / mo<input data-k="rent0" type="number" step="50"></label>
      <label>Down payment %<input data-k="downPct" type="number" step="1"></label>
      <label>Loan length (years)<select data-k="years"><option>30</option><option>15</option></select></label>
      <label>Interest rate % <small id="rateHint" class="muted"></small><input data-k="rate" type="number" step="0.05" placeholder="current"></label>
    </div>
    <div class="grid-inputs" style="grid-template-columns:1fr">
      <label>Work or school address, for drive times <small class="muted">(looked up with OpenStreetMap's free services; kept only in this browser)</small>
        <span class="row"><input id="workAddr" type="text" placeholder="e.g. 140 W 18th Ave, Columbus, OH" style="flex:1"><button type="button" id="workSet">Set</button></span></label>
      <div id="workStatus" class="note"></div>
    </div>
    <details class="sub">
      <summary>More assumptions</summary>
      <div class="grid-inputs">
        <label>Max % of income on housing<input data-k="housingShare" type="number"></label>
        <label>Max % of income on all debt<input data-k="dtiCap" type="number"></label>
        <label>Property tax %/yr <small class="muted">(blank = zip's own)</small><input data-k="taxRate" type="number" step="0.05" placeholder="auto"></label>
        <label>Home insurance %/yr<input data-k="insRate" type="number" step="0.05"></label>
        <label>Mortgage insurance %/yr (under 20% down)<input data-k="pmiRate" type="number" step="0.05"></label>
        <label>Upkeep %/yr of value<input data-k="maintRate" type="number" step="0.1"></label>
        <label>Closing costs % of price<input data-k="closingPct" type="number" step="0.5"></label>
        <label>Selling costs %<input data-k="sellPct" type="number" step="0.5"></label>
        <label>HOA / mo <small class="muted">(blank = typical condo fee here)</small><input data-k="hoa" type="number" step="25" placeholder="auto"></label>
        <label>Income growth %/yr<input data-k="incomeGrowth" type="number" step="0.5"></label>
        <label>Return on savings %/yr<input data-k="invReturn" type="number" step="0.5"></label>
        <label>Rate change over next 5 yrs (pts)<input data-k="rateShift" type="number" step="0.25"></label>
        <label>Compare plans over (years)<input data-k="H" type="number" min="6" max="30"></label>
        <label>Investor rate premium (pts)<input data-k="invPremium" type="number" step="0.125"></label>
        <label>Investor down payment %<input data-k="invDown" type="number"></label>
        <label>Rental vacancy %<input data-k="vacancy" type="number"></label>
        <label>Property manager % of rent<input data-k="mgmt" type="number"></label>
        <label>Rent from the part you rent out / mo <small class="muted">(blank = half of typical rent)</small><input data-k="hackRent" type="number" placeholder="auto"></label>
        <label>Airbnb nightly rate<input data-k="strNightly" type="number"></label>
        <label>Airbnb occupancy %<input data-k="strOcc" type="number"></label>
        <label>Airbnb fees + cleaning % of revenue<input data-k="strFees" type="number"></label>
      </div>
      <button type="button" id="resetInputs" class="link">Reset to defaults</button>
    </details>
  </details>

  <p id="status" class="status" role="status"></p>

  <main id="results" hidden>
    <section id="s-head"></section>
    <section id="s-summary" class="cards"></section>
    <section id="s-listings"></section>
    <section id="s-shortlist"></section>
    <section id="s-sun"></section>
    <section id="s-inspect"></section>
    <section id="s-market"></section>
    <section id="s-prices"></section>
    <section id="s-buying"></section>
    <section id="s-timing"></section>
    <section id="s-purpose"></section>
    <section id="s-hood"></section>
    <section id="s-hazards"></section>
    <section id="s-law"></section>
    <section id="s-schools"></section>
  </main>

  <footer id="sources" class="foot"></footer>
</div>

<script src="vendor/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="orient.js"></script>
<script src="app.js"></script>
</body>
</html>
