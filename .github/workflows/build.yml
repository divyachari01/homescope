name: Build and deploy

on:
  schedule:
    - cron: "37 11 * * *"     # every day, 11:37 UTC
  workflow_dispatch:           # "Run workflow" button for a manual refresh

permissions:
  contents: write              # to save refreshed listings back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # Keep downloaded source files between runs so slow-changing data is not re-downloaded daily.
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Fetch listings (RentCast)
        run: |
          mkdir -p logs
          python pipeline/fetch_listings.py 2>&1 | tee logs/listings.txt
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}

      - name: Save listings to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d listings ]; then
            git add listings logs/listings.txt
            git diff --cached --quiet || (git commit -m "Update listings" && git pull --rebase -q && git push) || echo "Could not save listings to the repo this time"
          fi

      - name: Build data
        run: |
          set -o pipefail
          python pipeline/build_data.py 2>&1 | tee build-log.txt
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      # Keep the last build's output in the repo (logs/last-build.txt) so problems are easy to read.
      - name: Save build log
        if: always()
        run: |
          mkdir -p logs && cp build-log.txt logs/last-build.txt 2>/dev/null || true
          git add logs
          git diff --cached --quiet || (git commit -m "Build log" && git pull --rebase -q && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
